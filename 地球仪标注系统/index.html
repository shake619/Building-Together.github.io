<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共同的建造 · 纪录片的建筑地球仪</title>
<style>
  :root{
    --bg:#040a12;
    --panel:rgba(9,20,33,.78);
    --line:rgba(110,170,255,.16);
    --txt:#e8f1fb;
    --dim:#8ba4bd;
    --accent:#38bdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body.dragging{cursor:grabbing}
  canvas{display:block}

  /* ---------- 背景光 ---------- */
  .bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(680px 520px at 62% 42%, rgba(30,110,210,.20), transparent 62%),
      radial-gradient(900px 700px at 15% 90%, rgba(120,60,200,.14), transparent 60%),
      radial-gradient(700px 600px at 92% 8%, rgba(0,180,200,.10), transparent 60%);}
  .bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background-image:linear-gradient(rgba(90,150,220,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(90,150,220,.05) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(circle at 60% 45%, #000 20%, transparent 78%);}

  /* ---------- 布局 ---------- */
  #app{position:relative;z-index:1;height:100%;display:flex}

  /* ---------- 左侧栏 ---------- */
  #side{width:340px;flex:0 0 340px;height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(8,18,30,.92), rgba(6,13,22,.86));
    border-right:1px solid var(--line);backdrop-filter:blur(18px);
    transition:margin-left .32s cubic-bezier(.3,.8,.2,1);position:relative;z-index:6}
  body.side-collapsed #side{margin-left:-340px}
  #side-toggle{position:absolute;right:-16px;top:26px;width:16px;height:44px;border:none;
    background:rgba(20,40,64,.9);border:1px solid var(--line);border-left:none;
    border-radius:0 8px 8px 0;color:var(--dim);cursor:pointer;font-size:10px;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:7}
  #side-toggle::after{content:'‹';transition:transform .3s;font-size:14px}
  body.side-collapsed #side-toggle::after{content:'›'}

  .brand{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
  .brand .kicker{font-size:11px;letter-spacing:.22em;color:#5f8bb8;text-transform:uppercase;margin-bottom:9px}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.02em;line-height:1.35;
    background:linear-gradient(100deg,#fff,#9fd0ff 55%,#6ea8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.7}

  .filters{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
  .search-box{position:relative;margin-bottom:11px}
  .search-box input{width:100%;height:34px;padding:0 12px 0 32px;border-radius:10px;
    background:rgba(16,32,50,.85);border:1px solid var(--line);color:var(--txt);font-size:12.5px;
    outline:none;transition:.2s}
  .search-box input::placeholder{color:#5e7893}
  .search-box input:focus{border-color:rgba(56,189,248,.5);background:rgba(18,38,60,.95)}
  .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}

  .f-label{font-size:10.5px;color:#64809b;letter-spacing:.12em;margin:8px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:104px;overflow:auto;padding-right:4px}
  .chips::-webkit-scrollbar{width:4px}
  .chips::-webkit-scrollbar-thumb{background:rgba(90,140,200,.3);border-radius:4px}
  .chip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:7px;
    background:rgba(18,34,52,.8);border:1px solid var(--line);color:#9db6cd;font-size:11.5px;
    cursor:pointer;transition:.18s;white-space:nowrap}
  .chip:hover{border-color:rgba(120,180,240,.4);color:#d8e8f8}
  .chip.on{background:rgba(30,80,140,.55);border-color:rgba(90,180,255,.65);color:#eaf5ff;
    box-shadow:0 0 0 1px rgba(90,180,255,.15) inset,0 2px 10px rgba(30,120,220,.25)}
  .chip .cd{width:6px;height:6px;border-radius:50%;flex:0 0 6px}

  .list-head{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 8px;font-size:11.5px;color:#6d89a4;letter-spacing:.08em}
  .count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:19px;
    padding:0 7px;border-radius:6px;background:rgba(56,189,248,.14);color:#7dd3fc;font-size:11px;font-weight:600}

  #list-body{flex:1;overflow-y:auto;padding:0 12px 24px}
  #list-body::-webkit-scrollbar{width:5px}
  #list-body::-webkit-scrollbar-thumb{background:rgba(80,140,210,.28);border-radius:5px}
  #list-body::-webkit-scrollbar-thumb:hover{background:rgba(80,140,210,.5)}

  .grp{margin-bottom:6px}
  .grp-title{display:flex;align-items:center;gap:7px;padding:11px 8px 6px;font-size:11.5px;color:#8aa6c2;letter-spacing:.05em}
  .grp-title em{font-style:normal;color:#4f6d8a;font-size:10.5px}
  .grp-bar{width:3px;height:11px;border-radius:2px}

  .case{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    background:transparent;border:1px solid transparent;cursor:pointer;text-align:left;
    transition:.16s;color:inherit;font-family:inherit}
  .case:hover{background:rgba(30,60,96,.45);border-color:rgba(90,150,220,.2)}
  .case.on{background:rgba(30,80,140,.5);border-color:rgba(90,180,255,.5)}
  .case-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .case-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .case-name{font-size:12.8px;color:#dbe9f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .case-sub{font-size:10.8px;color:#6b87a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .case-cat{font-size:10px;color:#7c9ab6;padding:2px 6px;border-radius:5px;
    background:rgba(255,255,255,.045);flex:0 0 auto}
  .empty{padding:40px 20px;text-align:center;color:#5b7690;font-size:12.5px;line-height:1.8}

  /* ---------- 主区 ---------- */
  #stage{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}

  .topbar{position:absolute;top:20px;left:24px;right:24px;display:flex;align-items:flex-start;
    justify-content:space-between;gap:16px;z-index:5;pointer-events:none}
  .stat-line{display:flex;gap:22px;pointer-events:auto;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;gap:3px}
  .stat b{font-size:23px;font-weight:700;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff,#8ec5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{font-size:10.5px;color:#6b87a3;letter-spacing:.14em}
  .tools{display:flex;gap:8px;pointer-events:auto}
  .tbtn{height:31px;padding:0 12px;border-radius:8px;background:rgba(12,26,42,.8);
    border:1px solid var(--line);color:#8fa9c2;font-size:11.5px;cursor:pointer;transition:.18s;
    display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px);font-family:inherit}
  .tbtn:hover{color:#dceaf7;border-color:rgba(120,180,240,.42)}
  .tbtn.on{color:#8fd8ff;border-color:rgba(90,180,255,.6);background:rgba(24,64,110,.7)}

  #globe-canvas{flex:1;position:relative;cursor:grab;min-height:0}
  #globe-canvas:active{cursor:grabbing}
  #globe-canvas canvas{position:absolute;inset:0}

  #tag-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;
    padding:3px 9px 3px 7px;border-radius:20px;background:rgba(8,20,34,.72);
    border:1px solid rgba(120,180,240,.22);font-size:11.5px;color:#c8dcee;white-space:nowrap;
    cursor:pointer;pointer-events:auto;backdrop-filter:blur(8px);
    transition:background .18s,border-color .18s,color .18s;will-change:transform}
  .tag:hover,.tag.is-hover{background:rgba(20,52,86,.92);border-color:rgba(120,190,255,.7);color:#fff}
  .tag.is-sel{background:rgba(24,72,124,.95);border-color:#7dd3fc;color:#fff;font-weight:600;
    box-shadow:0 4px 18px rgba(30,120,220,.45)}
  .tag-dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px}

  .legend{position:absolute;left:24px;bottom:18px;display:flex;gap:10px;align-items:center;
    font-size:10.5px;color:#5f7c98;z-index:5;flex-wrap:wrap;max-width:70%}
  .legend i{display:inline-block;width:18px;height:1px;background:linear-gradient(90deg,transparent,#4a9be0);
    vertical-align:middle;margin-right:5px}

  /* ---------- 详情面板 ---------- */
  #detail{position:absolute;top:0;right:0;height:100%;width:min(560px,47vw);z-index:8;
    background:linear-gradient(160deg,rgba(9,21,35,.97),rgba(6,14,24,.99));
    border-left:1px solid rgba(110,170,255,.2);backdrop-filter:blur(22px);
    transform:translateX(102%);transition:transform .42s cubic-bezier(.22,.9,.24,1);
    display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.6)}
  #detail.open{transform:translateX(0)}
  #detail::before{content:'';position:absolute;left:0;top:0;width:2px;height:100%;
    background:linear-gradient(180deg,transparent,var(--accent),transparent);opacity:.8}

  .d-head{padding:22px 26px 16px;border-bottom:1px solid var(--line);position:relative}
  .d-badges{display:flex;gap:7px;align-items:center;margin-bottom:12px}
  #d-ep{font-size:10.5px;font-weight:600;color:#0a1420;padding:3px 8px;border-radius:5px;letter-spacing:.05em}
  #d-cat{font-size:10.5px;color:var(--accent);padding:3px 8px;border-radius:5px;
    border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
    background:color-mix(in srgb,var(--accent) 12%,transparent)}
  #d-close{position:absolute;right:20px;top:20px;width:28px;height:28px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:#8fa9c2;cursor:pointer;
    font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.18s}
  #d-close:hover{background:rgba(255,90,90,.2);border-color:rgba(255,120,120,.5);color:#fff}
  #d-name{font-size:23px;font-weight:700;line-height:1.32;letter-spacing:.01em;padding-right:34px}
  #d-name-en{font-size:12px;color:#5e7c99;margin-top:6px;letter-spacing:.02em}
  #d-country{margin-top:12px;font-size:13px;color:#a8c1d8;display:flex;align-items:center;gap:7px}
  #d-country .sep{color:#3d5670}
  .flag-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor}

  .d-body{flex:1;overflow-y:auto;padding:18px 26px 40px}
  .d-body::-webkit-scrollbar{width:5px}
  .d-body::-webkit-scrollbar-thumb{background:rgba(80,140,210,.3);border-radius:5px}

  .sec-title{font-size:10.5px;letter-spacing:.18em;color:#5d7a96;margin:22px 0 10px;
    display:flex;align-items:center;gap:8px}
  .sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .sec-title:first-child{margin-top:0}

  #d-desc{font-size:13.6px;line-height:1.92;color:#c4d8ea}
  #d-quote{font-size:12.2px;line-height:1.88;color:#87a3bc;padding:12px 14px;
    border-left:2px solid var(--accent);background:rgba(255,255,255,.028);border-radius:0 8px 8px 0;
    margin-top:4px;font-style:normal}
  #d-quote::before{content:'字幕原句 · ';color:var(--accent);font-size:10.5px;letter-spacing:.06em;opacity:.85}

  #d-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
  .fig{cursor:zoom-in;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
  .fig.in{opacity:1;transform:none}
  .fig-img{position:relative;aspect-ratio:16/11;border-radius:9px;overflow:hidden;
    border:1px solid rgba(120,170,230,.2);background:#06121f}
  .fig-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
  .fig:hover .fig-img img{transform:scale(1.07)}
  .fig:hover .fig-img{border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
  figcaption{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6c88a4;margin-top:5px}
  figcaption b{color:var(--accent);font-weight:600}

  #d-meta{margin-top:8px;display:grid;gap:1px;border-radius:9px;overflow:hidden;
    background:rgba(255,255,255,.03);border:1px solid var(--line)}
  .mrow{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:12px;
    background:rgba(8,18,30,.6)}
  .mrow span{color:#6b87a3}
  .mrow b{color:#cfe2f3;font-weight:500;text-align:right}

  /* ---------- 大图 ---------- */
  #lightbox{position:fixed;inset:0;z-index:50;background:rgba(2,8,14,.92);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s}
  #lightbox.open{opacity:1;pointer-events:auto}
  .lb-inner{max-width:88vw;transform:scale(.96);transition:transform .28s}
  #lightbox.open .lb-inner{transform:scale(1)}
  .lb-inner img{max-width:88vw;max-height:76vh;border-radius:12px;border:1px solid rgba(120,170,230,.25)}
  .lb-cap{display:flex;justify-content:space-between;gap:20px;margin-top:12px;font-size:12.5px;color:#a9c2d8}
  .lb-cap b{color:#fff;font-weight:600}
  .lb-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .lb-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25)}
  .lb-dots i.on{background:#7dd3fc;box-shadow:0 0 8px #38bdf8}

  /* ---------- 首屏引导 ---------- */
  .hint{position:absolute;bottom:18px;right:24px;font-size:10.5px;color:#4f6a84;
    display:flex;gap:14px;z-index:5;letter-spacing:.03em}
  .hint kbd{font-family:inherit;padding:1px 5px;border-radius:4px;border:1px solid rgba(120,170,230,.22);
    color:#7b98b3;font-size:10px}

  @media (max-width:1080px){
    #side{width:300px;flex-basis:300px}
    body.side-collapsed #side{margin-left:-300px}
    #detail{width:min(500px,72vw)}
  }
  @media (max-width:760px){
    #side{position:absolute;z-index:9;width:86vw;flex-basis:86vw;margin-left:-86vw;
      box-shadow:30px 0 60px rgba(0,0,0,.5)}
    body:not(.side-collapsed) #side{margin-left:0}
    #detail{width:100vw}
    .stat-line .stat:nth-child(n+3){display:none}
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div id="app">
  <!-- 侧栏 -->
  <aside id="side">
    <button id="side-toggle" title="收起/展开"></button>
    <div class="brand">
      <div class="kicker">Belt &amp; Road · Built Together</div>
      <h1>共同的建造<br>纪录片建筑地球仪</h1>
      <div class="sub">把《共同的建造》里的桥、路、港、城，一颗颗钉回它们所在的那片土地。</div>
    </div>

    <div class="filters">
      <div class="search-box">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d99b5" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
        </svg>
        <input id="search" type="text" placeholder="搜索项目 / 国家 / 城市">
      </div>
      <div class="f-label">按集数</div>
      <div class="chips" id="ep-filter"></div>
      <div class="f-label" style="margin-top:12px">按类别</div>
      <div class="chips" id="cat-filter"></div>
    </div>

    <div class="list-head"><span>项目清单</span><span class="count-badge" id="count-badge">0</span></div>
    <div id="list-body"></div>
  </aside>

  <!-- 主舞台 -->
  <main id="stage">
    <div class="topbar">
      <div class="stat-line">
        <div class="stat"><b id="st-1">0</b><span>标注点</span></div>
        <div class="stat"><b id="st-2">0</b><span>国家 / 地区</span></div>
        <div class="stat"><b id="st-3">0</b><span>集数</span></div>
      </div>
      <div class="tools">
        <button class="tbtn on" id="btn-rotate">自转</button>
        <button class="tbtn on" id="btn-labels">标签</button>
        <button class="tbtn on" id="btn-arcs">连线</button>
        <button class="tbtn" id="btn-reset">复位</button>
      </div>
    </div>

    <div id="globe-canvas"></div>
    <div id="tag-layer"></div>

    <div class="legend">
      <span><i></i>以泉州（海上丝路起点）为原点连线至各项目所在地</span>
    </div>
    <div class="hint">
      <span>拖拽旋转</span><span>滚轮缩放</span><span><kbd>点击</kbd> 标记看三张图</span>
    </div>

    <!-- 详情 -->
    <section id="detail">
      <div class="d-head">
        <button id="d-close" title="关闭">×</button>
        <div class="d-badges"><span id="d-ep">第 1 集</span><span id="d-cat">桥梁</span></div>
        <div id="d-name">项目名</div>
        <div id="d-name-en"></div>
        <div id="d-country"></div>
      </div>
      <div class="d-body">
        <div class="sec-title">项目简介</div>
        <div id="d-desc"></div>

        <div class="sec-title">三张图</div>
        <div id="d-gallery"></div>

        <div class="sec-title">纪录片原文</div>
        <div id="d-quote"></div>

        <div class="sec-title">关键信息</div>
        <div id="d-meta"></div>
      </div>
    </section>
  </main>
</div>

<div id="lightbox"></div>

<script src="data/land110.js"></script>
<script src="data/projects.js"></script>
<script src="lib/three.min.js"></script>
<script src="src/globe.js"></script>
<script src="src/ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var S = window.__GLOBE__.initScene();
    window.__GLOBE__.buildMarkers();
    window.__GLOBE__.initUI();
    // 统计
    var P = window.PROJECT_SEED;
    document.getElementById('st-1').textContent = P.length;
    document.getElementById('st-2').textContent = new Set(P.map(function(p){return p.country})).size;
    document.getElementById('st-3').textContent = new Set(P.map(function(p){return p.ep})).size;
    requestAnimationFrame(window.__GLOBE__.loop);
    // 开场动画：从远处拉近
    setTimeout(function(){ window.__GLOBE__.focusLatLon(24, 80, 26); }, 350);
    setTimeout(function(){ /* noop */ }, 0);
  });
</script>
</body>
</html>
